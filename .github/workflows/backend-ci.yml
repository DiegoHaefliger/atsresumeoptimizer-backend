name: Backend CI

# Marque "Testes unitários e vulnerabilidades" como check obrigatório na branch protection da main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Testes unitários e vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Gate 1/2 — testes unitários
        run: ./mvnw -B -ntp clean test

      # Só restaura: o banco é gravado pelo nvd-cache.yml na main.
      - name: Restaurar banco NVD
        id: nvd
        uses: actions/cache/restore@v4
        with:
          path: .dependency-check-data
          key: nvd-data-somente-restauracao
          restore-keys: nvd-data-

      - name: Informar de onde veio o banco NVD
        env:
          MATCHED_KEY: ${{ steps.nvd.outputs.cache-matched-key }}
        run: |
          if [ -n "$MATCHED_KEY" ]; then
            echo "Banco NVD restaurado de \`$MATCHED_KEY\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Banco NVD não restaurado::Nenhum cache nvd-data- visível. Rode o workflow nvd-cache.yml na main; este run vai baixar o banco inteiro."
          fi

      - name: Avisar se NVD_API_KEY não estiver configurada
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning title=NVD_API_KEY ausente::Sem a chave a NVD limita a 5 req/30s e o download do feed leva ~20 min. Cadastre em https://nvd.nist.gov/developers/request-an-api-key e adicione o secret NVD_API_KEY."
          fi

      - name: Gate 2/2 — vulnerabilidades (OWASP Dependency-Check)
        id: cve
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp verify -DskipTests

      - name: Resumo das vulnerabilidades
        if: always() && steps.cve.conclusion != 'skipped'
        run: bash .github/scripts/summarize-dependency-check.sh 7.0 .

      - name: Relatório de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Relatório de testes (surefire)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/*.txt
          retention-days: 14
          if-no-files-found: ignore
