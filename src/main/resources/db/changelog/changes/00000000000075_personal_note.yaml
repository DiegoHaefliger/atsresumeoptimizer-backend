databaseChangeLog:
  - changeSet:
      id: 00000000000075-personal-note
      author: DiegoHaefliger
      changes:
        - createTable:
            tableName: personal_note
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
