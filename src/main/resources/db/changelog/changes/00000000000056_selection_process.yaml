databaseChangeLog:
  - changeSet:
      id: 00000000000056-selection-process
      author: DiegoHaefliger
      changes:
        - createTable:
            tableName: selection_process
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_posting_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_selection_process_job_posting
                    references: job_posting(id)
              - column:
                  name: process_url
                  type: varchar(1000)
              - column:
                  name: stage
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: applied_on
                  type: date
              - column:
                  name: next_step_on
                  type: date
              - column:
                  name: contact_name
                  type: varchar(255)
              - column:
                  name: contact_email
                  type: varchar(255)
              - column:
                  name: salary
                  type: numeric(12,2)
              - column:
                  name: notes
                  type: text
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_selection_process_job_posting
            tableName: selection_process
            columns:
              - column:
                  name: job_posting_id
        - createIndex:
            indexName: idx_selection_process_stage
            tableName: selection_process
            columns:
              - column:
                  name: stage
        - createTable:
            tableName: selection_stage_movement
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: process_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_selection_stage_movement_process
                    references: selection_process(id)
                    deleteCascade: true
              - column:
                  name: stage
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: text
              - column:
                  name: moved_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_selection_stage_movement_process
            tableName: selection_stage_movement
            columns:
              - column:
                  name: process_id
