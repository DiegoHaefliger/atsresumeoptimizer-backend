databaseChangeLog:
  - changeSet:
      id: 00000000000006-prompt-template
      author: DiegoHaefliger
      changes:
        - createTable:
            tableName: prompt_template
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: key
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: varchar(100)
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: prompt_template
            columnNames: key, version
            constraintName: uk_prompt_template_key_version
        - insert:
            tableName: prompt_template
            columns:
              - column:
                  name: id
                  value: 33333333-3333-3333-3333-333333333331
              - column:
                  name: key
                  value: job-structuring
              - column:
                  name: version
                  valueNumeric: 1
              - column:
                  name: content
                  value: |
                    Você é um analista de recrutamento. Extraia da descrição de vaga abaixo, em português,
                    um JSON com exatamente estes campos: "title" (cargo), "seniority" (júnior/pleno/sênior/etc.,
                    ou null), "minYearsExperience" (número inteiro ou null), "educationLevel" (texto curto ou
                    null), "languages" (lista de idiomas exigidos), "requiredKeywords" (lista de termos técnicos
                    ou de negócio obrigatórios, na grafia exata usada na vaga) e "keywordEquivalents" (objeto
                    mapeando cada termo de "requiredKeywords" para uma lista de sinônimos ou formas equivalentes
                    que um currículo poderia usar em vez do termo exato). Não invente requisitos que não estejam
                    no texto. Responda só com o JSON, sem comentários.

                    Vaga:
                    {{jobText}}
              - column:
                  name: model
                  value: gpt-4o-mini
        - insert:
            tableName: prompt_template
            columns:
              - column:
                  name: id
                  value: 33333333-3333-3333-3333-333333333332
              - column:
                  name: key
                  value: bullet-review
              - column:
                  name: version
                  valueNumeric: 1
              - column:
                  name: content
                  value: |
                    Você avalia bullets de currículo. Para cada bullet da lista abaixo, dê notas de 1 a 5 em
                    "impact" (mostra resultado/impacto?), "clarity" (claro e direto?) e "specificity"
                    (específico, não genérico?), mais uma "suggestion" curta de melhoria sem inventar dados que
                    não estejam no bullet original. Responda só com um JSON: lista de objetos com "bullet",
                    "impact", "clarity", "specificity" e "suggestion", na mesma ordem dos bullets de entrada.

                    Bullets:
                    {{bullets}}
              - column:
                  name: model
                  value: gpt-4o-mini
