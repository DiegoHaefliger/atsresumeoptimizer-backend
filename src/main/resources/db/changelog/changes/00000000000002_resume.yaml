databaseChangeLog:
  - changeSet:
      id: 00000000000002-resume
      author: DiegoHaefliger
      changes:
        - createTable:
            tableName: resume
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
