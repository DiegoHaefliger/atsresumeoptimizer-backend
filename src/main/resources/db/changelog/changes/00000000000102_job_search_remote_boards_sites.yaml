databaseChangeLog:
  - changeSet:
      id: 00000000000102-job-search-remote-boards-sites
      author: DiegoHaefliger
      changes:
        - sql:
            sql: >
              update job_preference set search_sites = search_sites || array['JOBICY','HIMALAYAS','GETONBOARD']
        - addDefaultValue:
            tableName: job_preference
            columnName: search_sites
            defaultValueComputed: "'{LINKEDIN,GUPY,PROGRAMATHOR,INFOJOBS,VAGAS,REMOTAR,JOBICY,HIMALAYAS,GETONBOARD}'"
