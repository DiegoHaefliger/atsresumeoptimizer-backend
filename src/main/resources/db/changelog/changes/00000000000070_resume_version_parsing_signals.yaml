                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: has_icon_glyphs_without_unicode
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: has_hidden_text
