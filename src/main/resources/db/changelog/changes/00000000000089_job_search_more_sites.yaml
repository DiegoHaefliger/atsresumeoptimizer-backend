databaseChangeLog:
  - changeSet:
      id: 00000000000089-job-search-more-sites
      author: DiegoHaefliger
      changes:
        - sql:
            sql: >
              update job_preference set search_sites = array_cat(search_sites, array['INFOJOBS','VAGAS'])
        - addDefaultValue:
            tableName: job_preference
            columnName: search_sites
            defaultValueComputed: "'{LINKEDIN,GUPY,PROGRAMATHOR,INFOJOBS,VAGAS}'"
