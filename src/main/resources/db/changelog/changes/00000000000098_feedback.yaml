databaseChangeLog:
  - changeSet:
      id: 00000000000098-feedback
      author: DiegoHaefliger
      changes:
        - createTable:
            tableName: feedback
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: kind
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: rating
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: text
              - column:
                  name: contact
                  type: varchar(200)
              - column:
                  name: allow_publish
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: app_version
                  type: varchar(40)
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: delivered_at
                  type: timestamptz
        - createIndex:
            tableName: feedback
            indexName: idx_feedback_pending
            columns:
              - column:
                  name: delivered_at
