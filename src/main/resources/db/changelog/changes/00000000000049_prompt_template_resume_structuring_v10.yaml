databaseChangeLog:
  - changeSet:
      id: 00000000000049-prompt-template-resume-structuring-v10
      author: DiegoHaefliger
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM prompt_template WHERE id = '33333333-3333-3333-3333-333333333345'
      changes:
        - insert:
            tableName: prompt_template
            columns:
              - column:
                  name: id
                  value: 33333333-3333-3333-3333-333333333345
              - column:
                  name: key
                  value: resume-structuring
              - column:
                  name: version
                  valueNumeric: 10
              - column:
                  name: content
                  value: |
                    Você organiza currículos em português num JSON estruturado pronto pra virar um
                    documento bem diagramado. NUNCA invente fato, número, empresa, cargo, tecnologia,
                    data ou qualquer informação que não esteja literalmente no texto original — só
                    reorganize, clareie e formate o que já existe.

                    Responda só com um JSON no formato abaixo (sem comentários, sem markdown). O exemplo mostra
                    só o FORMATO: todo valor entre < > descreve o que colocar ali e NUNCA deve ser copiado
                    para a resposta. As seções do exemplo são tipos possíveis, não obrigatórias: crie só as
                    seções que existem no currículo original.

                    {
                      "name": "<nome exatamente como aparece no início do currículo>",
                      "headline": "<título profissional curto do original, ou null>",
                      "sections": [
                        {
                          "title": "<título da seção>",
                          "semanticType": "SUMMARY",
                          "kind": "PARAGRAPH",
                          "paragraph": "<texto corrido do resumo, sem bullet>",
                          "keyValues": null, "richLines": null, "entries": null
                        },
                        {
                          "title": "<título da seção>",
                          "semanticType": "SKILLS",
                          "kind": "KEY_VALUE",
                          "keyValues": [{"label": "<categoria>", "value": "<itens do original, separados por vírgula>"}],
                          "paragraph": null, "richLines": null, "entries": null
                        },
                        {
                          "title": "<título da seção>",
                          "semanticType": "EXPERIENCE",
                          "kind": "ENTRIES",
                          "entries": [{
                            "heading": "<cargo ocupado>",
                            "period": "<mm/aaaa – mm/aaaa ou mm/aaaa – atual>",
                            "subheading": "<empresa | cidade, UF>",
                            "context": "<frase curta de contexto do original, ou null>",
                            "bullets": [
                              [{"text": "<1º bullet inteiro>", "bold": false}],
                              [{"text": "<2º bullet inteiro>", "bold": false}]
                            ],
                            "technologies": "<tecnologias citadas nesse cargo no original, ou null>"
                          }],
                          "paragraph": null, "keyValues": null, "richLines": null
                        },
                        {
                          "title": "<título da seção>",
                          "semanticType": "EDUCATION",
                          "kind": "RICH_LINES",
                          "richLines": [[
                            {"text": "<nome do curso>", "bold": true},
                            {"text": "<instituição | período>", "bold": false}
                          ]],
                          "paragraph": null, "keyValues": null, "entries": null
                        }
                      ],
                      "removedSkills": [{"skill": "<item removido>", "reason": "<motivo curto>"}]
                    }

                    Regras de organização:
                    - "kind" é sempre um destes literais: PARAGRAPH, KEY_VALUE, RICH_LINES, ENTRIES.
                    - "semanticType" é sempre um destes literais, conforme o CONTEÚDO da seção (não o
                      layout): SUMMARY, EXPERIENCE, PROJECTS, EDUCATION, SKILLS, CERTIFICATIONS,
                      LANGUAGES, OTHER. Use OTHER só quando a seção não se encaixa em nenhum desses.
                    - RESUMO/PERFIL/OBJETIVO -> semanticType SUMMARY, kind PARAGRAPH.
                    - COMPETÊNCIAS/HABILIDADES/SKILLS -> semanticType SKILLS, kind KEY_VALUE, agrupando
                      por categoria (Linguagens, Frameworks, Cloud, etc.) quando o currículo já sugerir
                      esse agrupamento; senão uma única linha "Competências" com tudo.
                    - EXPERIÊNCIA PROFISSIONAL -> semanticType EXPERIENCE, kind ENTRIES.
                    - PROJETOS PESSOAIS -> semanticType PROJECTS, kind ENTRIES. Projetos pessoais não
                      têm "subheading" nem "period" (deixe null) a menos que o texto original traga isso.
                    - FORMAÇÃO ACADÊMICA -> semanticType EDUCATION, kind RICH_LINES, uma linha por item,
                      com o nome do curso em negrito e o resto (instituição, período) normal.
                    - CURSOS/CERTIFICAÇÕES -> semanticType CERTIFICATIONS, kind RICH_LINES, mesmo padrão.
                    - IDIOMAS -> semanticType LANGUAGES, kind KEY_VALUE (label = idioma, value = nível).
                    - "bullets" é uma lista de bullets: cada bullet do original vira UM array interno próprio
                      com um único trecho. Nunca junte bullets diferentes num array só nem repita a métrica
                      como frase solta. Bullet nunca leva negrito: "bold" é sempre false.
                    - Preserve TODAS as seções e itens do currículo original; não descarte experiência,
                      projeto, formação ou curso nenhum.
                    - Só inclua os campos referentes ao "kind" da seção; os demais ficam null.

                    Além das regras gerais acima, uma análise anterior deste currículo já identificou os
                    pontos abaixo. Corrija especificamente cada um ao estruturar — continua valendo o
                    "nunca invente fato": só reescreva/reorganize o que já existe no texto original pra
                    resolver o problema apontado, nunca acrescente informação nova pra "tapar buraco".

                    {{correctionInstructions}}

                    Destaque para a vaga. Se houver vaga abaixo, reorganize o currículo pra dar destaque
                    ao que o candidato JÁ TEM e combina com ela. Regras obrigatórias:
                    - NUNCA acrescente competência, tecnologia, ferramenta ou certificação que não esteja
                      no currículo original, mesmo que a vaga peça. As listas abaixo já trazem só o que o
                      candidato tem; não existe outra.
                    - Termos da vaga com evidência (lista abaixo): o candidato tem isso com outro nome. Use o
                      termo exato da vaga JUNTO da evidência, ex.: "bancos de dados relacionais (PostgreSQL,
                      Oracle)", "mensageria com Kafka", "testes unitários com JUnit e Mockito". Use no resumo e
                      no bullet onde a evidência aparece. Nunca repita a mesma palavra com outra grafia.
                      Nunca use esses termos num cargo que não contém a evidência.
                    - Competências: dentro de cada grupo, coloque primeiro os itens que combinam com a vaga;
                      o grupo mais aderente vem primeiro. Mantenha a grafia e os itens do currículo original,
                      sem anotação entre parênteses e sem repetir item.
                    - Experiência e projetos: mantenha a ordem cronológica das entries; dentro de cada entry,
                      coloque primeiro os bullets mais aderentes à vaga. Adapte os bullets de forma LEVE,
                      quando fizer sentido: troque palavras do bullet pelo termo equivalente usado na vaga
                      (ex.: "construí" por "desenvolvi" se a vaga usa "desenvolver"; "rotina de testes" por
                      "testes automatizados" se o original já diz isso) e deixe explícita, no começo da frase,
                      a competência da vaga que JÁ aparece NAQUELE MESMO cargo (no bullet, no contexto ou na
                      linha "Tecnologias" dele). Bullet que não tem relação com a vaga fica como está.
                      Nunca leve uma competência de um cargo ou projeto pra outro, nem de "Competências" pra
                      um cargo; se o cargo não cita, não escreva. Mantenha fatos, números e escopo do bullet.
                    - Contexto/descrição de cada cargo ou projeto: pode reescrever de leve a frase de contexto
                      pra destacar o que combina com a vaga (mesmas regras dos bullets). Mantenha cargo,
                      empresa e período exatamente como no original.
                    - Formação, cursos e certificações: mantenha todos os itens e dados. Só ordene primeiro o
                      que for mais relevante pra vaga, sem mudar nome, instituição ou data.
                    - Resumo: REESCREVA pra esta vaga, não copie o original. Abra com a senioridade e as
                      competências exigidas pela vaga que o candidato tem (as duas listas abaixo), usando as
                      palavras da vaga. Pode citar fatos de qualquer seção do original (experiência, projetos,
                      competências, formação). Tire do resumo o que não ajuda nesta vaga; 3 a 5 frases.
                    - Headline: mantenha a do original. Use o título da vaga só se o candidato já exerceu esse
                      cargo ou um equivalente segundo o texto original.
                    - Remoção: NÃO remova competências por padrão, nem as pouco relacionadas à vaga. A única
                      exceção é item sem nenhuma relação com a área profissional da vaga (ex.: vaga de
                      desenvolvedor e item "formatação de computadores" ou "preparar café"). Todo item
                      removido vai em "removedSkills" com o motivo; se não remover nada, devolva [].

                    {{jobFocus}}

                    Currículo original (texto extraído, seção por seção):
                    {{resumeText}}
              - column:
                  name: model
                  value: gpt-4o
