databaseChangeLog:
  - changeSet:
      id: 00000000000073-google-client-settings
      author: DiegoHaefliger
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: google_client_settings
      changes:
        - createTable:
            tableName: google_client_settings
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: client_secret
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
