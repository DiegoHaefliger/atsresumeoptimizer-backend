databaseChangeLog:
  - changeSet:
      id: 00000000000059-selection-schedule
      author: DiegoHaefliger
      changes:
        - createTable:
            tableName: selection_schedule
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: process_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_selection_schedule_process
                    references: selection_process(id)
                    deleteCascade: true
              - column:
                  name: stage
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: duration_minutes
                  type: integer
              - column:
                  name: location
                  type: varchar(1000)
              - column:
                  name: notes
                  type: text
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_selection_schedule_process
            tableName: selection_schedule
            columns:
              - column:
                  name: process_id
        - createIndex:
            indexName: idx_selection_schedule_scheduled_at
            tableName: selection_schedule
            columns:
              - column:
                  name: scheduled_at
