databaseChangeLog:
  - changeSet:
      id: 00000000000041-resume-content
      author: DiegoHaefliger
      changes:
        - createTable:
            tableName: resume_content
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resume_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_resume_content_resume
                    references: resume(id)
              - column:
                  name: docx_version_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_resume_content_docx_version
                    references: resume_version(id)
              - column:
                  name: pdf_version_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_resume_content_pdf_version
                    references: resume_version(id)
              - column:
                  name: template
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: document
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_resume_content_docx_version
            tableName: resume_content
            columns:
              - column:
                  name: docx_version_id
        - createIndex:
            indexName: idx_resume_content_pdf_version
            tableName: resume_content
            columns:
              - column:
                  name: pdf_version_id
