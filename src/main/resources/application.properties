spring.application.name=AtsResumeOptimizerBackend
spring.config.import=optional:file:.env[.properties]

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
app.storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
app.storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
app.storage.bucket=${STORAGE_BUCKET:resumes}

app.ai.temperature=0.1
app.ai.max-output-tokens=2000
app.ai.timeout=120s
app.ai.settings-secret=${AI_SETTINGS_SECRET:}
app.ai.settings-secret-file=${AI_SETTINGS_SECRET_FILE:${user.home}/.ats-resume-optimizer/ai-settings-secret}
app.ai.tasks.resume-structuring.max-output-tokens=16000

app.rewrite.rate-limit.capacity=${REWRITE_RATE_LIMIT_CAPACITY:5}
app.rewrite.rate-limit.period=${REWRITE_RATE_LIMIT_PERIOD:24h}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# LGPD: dias até um resume_version (arquivo + texto extraído) expirar sozinho; roda todo dia às 3h.
app.resume.retention-days=${RESUME_RETENTION_DAYS:90}
app.resume.retention-cron=${RESUME_RETENTION_CRON:0 0 3 * * *}

app.integration.api-key=${INTEGRATION_API_KEY:}
